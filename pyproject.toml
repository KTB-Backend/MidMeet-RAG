[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midmeet-rag"
version = "0.1.0"
description = "RAG harness for meeting-place recommendations."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
embeddings = [
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["rag_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
addopts = "-q"
